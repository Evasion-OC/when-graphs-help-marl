[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnnmarl"
version = "0.0.1"
description = "Controlled empirical study of graph-based MARL"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Ali Jabbary", email = "st_a.jabbary@urmia.ac.ir"},
    {name = "Kasra Ghanavati", email = "kg1111r@gre.ac.uk"},
]
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tyro>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mpe = [
    # The MPE benchmarks (simple_spread, simple_tag, simple_reference, ...)
    # moved out of pettingzoo into the standalone `mpe2` package; it pulls in
    # a compatible pettingzoo>=1.24.3 transitively. `pettingzoo[mpe]` is kept
    # as a fallback import path in mpe_adapter.py for older installs, but is
    # NOT pinned here: its `[mpe]` extra pulls in `supersuit`, whose
    # `tinyscaler` dependency has no Windows/py3.13 wheel and requires MSVC
    # build tools to compile from source. supersuit is unused anywhere in
    # this codebase (frame-stacking / vectorization helpers we don't call),
    # so it is dropped rather than pinned.
    "mpe2>=1.1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
