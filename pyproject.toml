[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnnmarl"
version = "0.0.1"
description = "Controlled empirical study of graph-based MARL"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Kasra Ghanavati"},
]
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tyro>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mpe = [
    "mpe2>=0.0.1",  # MPE moved out of pettingzoo[mpe] in 1.26+
    "pettingzoo>=1.26",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
